<header><h1>VILLUMINATIONS</h1>
<p>Doce lanzamientos. Cada uno abre el día que abre su temporada, no el día 1 del mes:
la fecha la pone el cielo y se puede comprobar. Hoy está vivo <b>virgo</b>.</p></header>
<main><figure class="">
  <svg viewBox="0 0 800 1000"><use href="#vi-aries"/></svg>
  <figcaption><b>Primer Filo</b><span>21 de marzo — 19 de abril</span>
  <em>fuego</em><p>Abre la rueda el día del equinoccio. La temporada de empezar otra vez.</p><p class=dib>Veintiuna costillas largas y finas: el abanico más denso de los cuatro.</p></figcaption>
</figure><figure class="">
  <svg viewBox="0 0 800 1000"><use href="#vi-tauro"/></svg>
  <figcaption><b>Peso Muerto</b><span>20 de abril — 20 de mayo</span>
  <em>tierra</em><p>Lo que se sostiene sin moverse: la fuerza que no sale en la foto.</p><p class=dib>Doce costillas cortas y gruesas: la más pesada de tinta y la que menos se abre.</p></figcaption>
</figure><figure class="">
  <svg viewBox="0 0 800 1000"><use href="#vi-geminis"/></svg>
  <figcaption><b>Dos Voces</b><span>21 de mayo — 20 de junio</span>
  <em>aire</em><p>El glifo son dos barras iguales. Es el único que no se puede leer solo.</p><p class=dib>Veintitrés costillas, el abanico más ancho y el trazo más leve de la serie.</p></figcaption>
</figure><figure class="">
  <svg viewBox="0 0 800 1000"><use href="#vi-cancer"/></svg>
  <figcaption><b>Marea Alta</b><span>21 de junio — 22 de julio</span>
  <em>agua</em><p>Abre en el solsticio de verano, el día más largo del año.</p><p class=dib>Dieciséis costillas que se rizan: es la de curvatura más marcada, y por eso la que más se mueve.</p></figcaption>
</figure><figure class="">
  <svg viewBox="0 0 800 1000"><use href="#vi-leo"/></svg>
  <figcaption><b>Corona Solar</b><span>23 de julio — 22 de agosto</span>
  <em>fuego</em><p>El acento más caliente de los doce. Se lleva a plena luz o no se lleva.</p><p class=dib>Veintiuna costillas largas y finas: el abanico más denso de los cuatro.</p></figcaption>
</figure><figure class="vivo">
  <svg viewBox="0 0 800 1000"><use href="#vi-virgo"/></svg>
  <figcaption><b>Cuenta Exacta</b><span>23 de agosto — 22 de septiembre</span>
  <em>tierra</em><p>La temporada de medir. Es la que menos gusta y la que más cambia.</p><p class=dib>Doce costillas cortas y gruesas: la más pesada de tinta y la que menos se abre.</p></figcaption>
</figure><figure class="">
  <svg viewBox="0 0 800 1000"><use href="#vi-libra"/></svg>
  <figcaption><b>Punto de Equilibrio</b><span>23 de septiembre — 22 de octubre</span>
  <em>aire</em><p>Abre en el equinoccio de otoño: doce horas de luz y doce de sombra.</p><p class=dib>Veintitrés costillas, el abanico más ancho y el trazo más leve de la serie.</p></figcaption>
</figure><figure class="">
  <svg viewBox="0 0 800 1000"><use href="#vi-escorpio"/></svg>
  <figcaption><b>Fondo Negro</b><span>23 de octubre — 21 de noviembre</span>
  <em>agua</em><p>La temporada en que el día se acorta más deprisa.</p><p class=dib>Dieciséis costillas que se rizan: es la de curvatura más marcada, y por eso la que más se mueve.</p></figcaption>
</figure><figure class="">
  <svg viewBox="0 0 800 1000"><use href="#vi-sagitario"/></svg>
  <figcaption><b>Tiro Largo</b><span>22 de noviembre — 21 de diciembre</span>
  <em>fuego</em><p>El glifo es una flecha, y es el único de los doce que apunta afuera.</p><p class=dib>Veintiuna costillas largas y finas: el abanico más denso de los cuatro.</p></figcaption>
</figure><figure class="">
  <svg viewBox="0 0 800 1000"><use href="#vi-capricornio"/></svg>
  <figcaption><b>Ascenso Frío</b><span>22 de diciembre — 19 de enero</span>
  <em>tierra</em><p>Abre en el solsticio de invierno, el día más corto. Se sube cuando peor se está.</p><p class=dib>Doce costillas cortas y gruesas: la más pesada de tinta y la que menos se abre.</p></figcaption>
</figure><figure class="">
  <svg viewBox="0 0 800 1000"><use href="#vi-acuario"/></svg>
  <figcaption><b>Corriente</b><span>20 de enero — 18 de febrero</span>
  <em>aire</em><p>El glifo son dos ondas. La temporada de romper el patrón.</p><p class=dib>Veintitrés costillas, el abanico más ancho y el trazo más leve de la serie.</p></figcaption>
</figure><figure class="">
  <svg viewBox="0 0 800 1000"><use href="#vi-piscis"/></svg>
  <figcaption><b>Última Vuelta</b><span>19 de febrero — 20 de marzo</span>
  <em>agua</em><p>Cierra la rueda y devuelve al primero. Se agota cuando entra Aries.</p><p class=dib>Dieciséis costillas que se rizan: es la de curvatura más marcada, y por eso la que más se mueve.</p></figcaption>
</figure></main>
<footer>Falta la hoja del proveedor de estampación y qué lámina va en qué prenda.<br>
Ninguna de las dos se puede inventar.</footer>
