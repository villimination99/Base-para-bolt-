<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="1.3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ══════════════ RUEDA ZODIACAL ══════════════ -->
  <symbol id="r-zodiaco" viewBox="0 0 240 240">
    <g filter="url(#glow)" fill="none" stroke="var(--acento)" stroke-linecap="round">
      <circle cx="120" cy="120" r="108" stroke-width="1.6" opacity=".45"/>
      <circle cx="120" cy="120" r="96"  stroke-width="2.6"/>
      <circle cx="120" cy="120" r="62"  stroke-width="1.8" opacity=".7"/>
      <circle cx="120" cy="120" r="26"  stroke-width="2.2"/>
      <!-- 12 divisiones -->
      <g stroke-width="1.4" opacity=".55">
        <path d="M120 24 V58 M120 182 V216"/>
        <path d="M24 120 H58 M182 120 H216"/>
        <path d="M52 52 L76 76 M164 164 L188 188"/>
        <path d="M188 52 L164 76 M76 164 L52 188"/>
        <path d="M71 31 L85 62 M155 178 L169 209"/>
        <path d="M209 71 L178 85 M62 155 L31 169"/>
        <path d="M169 31 L155 62 M85 178 L71 209"/>
        <path d="M31 71 L62 85 M178 155 L209 169"/>
      </g>
      <!-- núcleo: sol y luna entrelazados -->
      <circle cx="120" cy="120" r="11" stroke-width="2"/>
      <path d="M113 112 a11 11 0 1 0 0 16 a9 9 0 1 1 0 -16z" stroke-width="1.8" stroke="var(--acento-2)"/>
    </g>
    <g fill="var(--acento)" filter="url(#glow-s)">
      <circle cx="120" cy="24" r="3.4"/><circle cx="120" cy="216" r="3.4"/>
      <circle cx="24" cy="120" r="3.4"/><circle cx="216" cy="120" r="3.4"/>
      <circle cx="52" cy="52" r="2.6"/><circle cx="188" cy="188" r="2.6"/>
      <circle cx="188" cy="52" r="2.6"/><circle cx="52" cy="188" r="2.6"/>
    </g>
    <g fill="var(--acento-2)" opacity=".85" filter="url(#glow-s)">
      <circle cx="71" cy="31" r="2"/><circle cx="169" cy="209" r="2"/>
      <circle cx="209" cy="71" r="2"/><circle cx="31" cy="169" r="2"/>
      <circle cx="169" cy="31" r="2"/><circle cx="71" cy="209" r="2"/>
      <circle cx="31" cy="71" r="2"/><circle cx="209" cy="169" r="2"/>
    </g>
  </symbol>

  <!-- ══════════════ PENTAGRAMA DE LOS CUATRO ══════════════ -->
  <symbol id="r-pentagrama" viewBox="0 0 240 240">
    <g filter="url(#glow)" fill="none" stroke="var(--acento)" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="120" cy="120" r="104" stroke-width="1.6" opacity=".4"/>
      <circle cx="120" cy="120" r="92"  stroke-width="2.6"/>
      <!-- estrella de cinco puntas -->
      <path d="M120 34 L173 197 L34 96 H206 L67 197 Z" stroke-width="2.6"/>
      <!-- cuadrado de los elementos -->
      <g stroke="var(--acento-2)" stroke-width="1.4" opacity=".6">
        <path d="M120 12 V34 M120 206 V228"/>
        <path d="M12 120 H34 M206 120 H228"/>
      </g>
    </g>
    <!-- cuatro elementos en los vértices -->
    <g fill="none" stroke="var(--acento-2)" stroke-width="2" filter="url(#glow-s)">
      <path d="M120 6 l9 15 h-18 z"/>                     <!-- fuego -->
      <path d="M120 234 l-9 -15 h18 z"/>                  <!-- agua -->
      <path d="M6 120 l15 -9 v18 z"/>                     <!-- aire -->
      <path d="M234 120 l-15 9 v-18 z"/>                  <!-- tierra -->
    </g>
    <g fill="var(--acento)" filter="url(#glow-s)">
      <circle cx="120" cy="34" r="3.6"/><circle cx="34" cy="96" r="3"/>
      <circle cx="206" cy="96" r="3"/><circle cx="67" cy="197" r="3"/>
      <circle cx="173" cy="197" r="3"/>
    </g>
    <circle cx="120" cy="120" r="14" fill="none" stroke="var(--acento)" stroke-width="2" filter="url(#glow-s)"/>
    <circle cx="120" cy="120" r="4" fill="var(--acento)" filter="url(#glow-s)"/>
  </symbol>

  <!-- ══════════════ OJO DEL CONOCIMIENTO ══════════════ -->
  <symbol id="r-ojo" viewBox="0 0 240 240">
    <g filter="url(#glow)" fill="none" stroke="var(--acento)" stroke-linecap="round" stroke-linejoin="round">
      <!-- triángulo -->
      <path d="M120 26 L214 196 H26 Z" stroke-width="2.6"/>
      <path d="M120 52 L192 182 H48 Z" stroke-width="1.4" opacity=".45"/>
      <!-- ojo -->
      <path d="M62 138 q58 -54 116 0 q-58 54 -116 0z" stroke-width="2.6"/>
      <circle cx="120" cy="138" r="24" stroke-width="2.2"/>
      <!-- rayos -->
      <g stroke-width="1.6" opacity=".6" stroke="var(--acento-2)">
        <path d="M120 178 V206"/>
        <path d="M84 172 L70 196 M156 172 L170 196"/>
        <path d="M56 152 L32 164 M184 152 L208 164"/>
      </g>
    </g>
    <circle cx="120" cy="138" r="9" fill="var(--acento)" filter="url(#glow-s)"/>
    <circle cx="124" cy="133" r="3" fill="#fff" opacity=".9"/>
    <g fill="var(--acento-2)" filter="url(#glow-s)" opacity=".9">
      <circle cx="120" cy="26" r="3.4"/><circle cx="26" cy="196" r="2.8"/><circle cx="214" cy="196" r="2.8"/>
    </g>
  </symbol>

  <!-- ══════════════ FILIGRANA DE SEPARACIÓN ══════════════ -->
  <symbol id="filigrana" viewBox="0 0 120 16">
    <g fill="none" stroke="var(--acento)" stroke-width="1.2" stroke-linecap="round">
      <path d="M4 8 H44" opacity=".5"/><path d="M76 8 H116" opacity=".5"/>
      <path d="M52 8 l8 -6 l8 6 l-8 6 z"/>
      <circle cx="48" cy="8" r="1.6" fill="var(--acento)" stroke="none"/>
      <circle cx="72" cy="8" r="1.6" fill="var(--acento)" stroke="none"/>
    </g>
  </symbol>
</svg>
