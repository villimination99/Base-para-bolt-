<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <defs>
    <filter id="ng" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ngs" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="core">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="var(--accent)"/>
      <stop offset="100%" stop-color="var(--accent-2)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ══════════════ ROBOT LEVANTANDO PESAS ══════════════ -->
  <symbol id="r-lift" viewBox="0 0 200 240">
    <g filter="url(#ng)" fill="none" stroke="var(--accent)" stroke-width="5"
       stroke-linecap="round" stroke-linejoin="round">
      <!-- barra y discos -->
      <line x1="46" y1="18" x2="154" y2="18" stroke-width="4"/>
      <rect x="34" y="4" width="10" height="28" rx="3" stroke="var(--accent-2)"/>
      <rect x="48" y="9" width="7" height="18" rx="2.5" stroke="var(--accent-2)"/>
      <rect x="156" y="4" width="10" height="28" rx="3" stroke="var(--accent-2)"/>
      <rect x="145" y="9" width="7" height="18" rx="2.5" stroke="var(--accent-2)"/>
      <!-- brazos -->
      <path d="M72 84 L62 52 L72 18"/>
      <path d="M128 84 L138 52 L128 18"/>
      <!-- cabeza -->
      <rect x="76" y="30" width="48" height="40" rx="12" stroke-width="3.4"/>
      <line x1="100" y1="30" x2="100" y2="18" stroke-width="2.6" stroke="var(--accent-2)"/>
      <!-- torso -->
      <line x1="100" y1="70" x2="100" y2="78"/>
      <rect x="72" y="78" width="56" height="52" rx="11" stroke-width="3.4"/>
      <!-- piernas -->
      <path d="M86 144 L82 180 L84 214"/>
      <path d="M114 144 L118 180 L116 214"/>
      <line x1="84" y1="216" x2="98" y2="216"/>
      <line x1="116" y1="216" x2="130" y2="216"/>
      <rect x="78" y="130" width="44" height="14" rx="6" stroke-width="3.4"/>
    </g>
    <g fill="var(--accent)" filter="url(#ngs)">
      <circle cx="62" cy="52" r="4.6"/><circle cx="138" cy="52" r="4.6"/>
      <circle cx="82" cy="180" r="4.6"/><circle cx="118" cy="180" r="4.6"/>
      <circle cx="100" cy="12" r="3.4" fill="var(--accent-2)"/>
    </g>
    <!-- visor + ojos -->
    <rect x="84" y="42" width="32" height="15" rx="5" fill="rgba(0,0,0,.55)" stroke="var(--accent)" stroke-width="1.6" opacity=".9"/>
    <g filter="url(#ngs)"><circle cx="93" cy="49.5" r="3.4" fill="#fff"/><circle cx="107" cy="49.5" r="3.4" fill="#fff"/></g>
    <circle cx="100" cy="104" r="11" fill="url(#core)" opacity=".85"/>
    <circle cx="100" cy="104" r="4.4" fill="var(--accent)" filter="url(#ngs)"/>
  </symbol>

  <!-- ══════════════ ROBOT COCINANDO ══════════════ -->
  <symbol id="r-cook" viewBox="0 0 200 240">
    <g filter="url(#ng)" fill="none" stroke="var(--accent)" stroke-width="5"
       stroke-linecap="round" stroke-linejoin="round">
      <!-- cabeza + gorro -->
      <rect x="76" y="34" width="48" height="40" rx="12" stroke-width="3.4"/>
      <path d="M74 34 q4 -16 26 -16 q22 0 26 16 z" stroke-width="3" stroke="var(--accent-2)"/>
      <!-- torso -->
      <line x1="100" y1="74" x2="100" y2="82"/>
      <rect x="72" y="82" width="56" height="52" rx="11" stroke-width="3.4"/>
      <!-- delantal -->
      <path d="M84 96 h32 v30 q-16 8 -32 0 z" stroke-width="2.2" stroke="var(--accent-2)" opacity=".75"/>
      <!-- brazo izq. con sartén -->
      <path d="M72 90 L50 108 L40 92"/>
      <path d="M8 84 h34 q2 10 -6 12 H16 q-8 -2 -8 -12 z" stroke-width="3.2" stroke="var(--accent-2)"/>
      <line x1="42" y1="86" x2="54" y2="90" stroke-width="3.2" stroke="var(--accent-2)"/>
      <!-- brazo der. con cuchara -->
      <path d="M128 90 L148 106 L152 80"/>
      <line x1="152" y1="80" x2="160" y2="58" stroke-width="3" stroke="var(--accent-2)"/>
      <ellipse cx="162" cy="53" rx="5" ry="7" stroke-width="3" stroke="var(--accent-2)"/>
      <!-- vapor -->
      <g stroke="var(--accent)" stroke-width="2.4" opacity=".7">
        <path d="M18 74 q6 -8 0 -16 q-6 -8 0 -14"/>
        <path d="M30 72 q6 -8 0 -16 q-6 -8 0 -12"/>
        <path d="M42 74 q6 -8 0 -16"/>
      </g>
      <!-- piernas -->
      <rect x="78" y="134" width="44" height="14" rx="6" stroke-width="3.4"/>
      <path d="M86 148 L82 182 L84 214"/>
      <path d="M114 148 L118 182 L116 214"/>
      <line x1="84" y1="216" x2="98" y2="216"/>
      <line x1="116" y1="216" x2="130" y2="216"/>
    </g>
    <g fill="var(--accent)" filter="url(#ngs)">
      <circle cx="50" cy="108" r="4.6"/><circle cx="148" cy="106" r="4.6"/>
      <circle cx="82" cy="182" r="4.6"/><circle cx="118" cy="182" r="4.6"/>
    </g>
    <rect x="84" y="46" width="32" height="15" rx="5" fill="rgba(0,0,0,.55)" stroke="var(--accent)" stroke-width="1.6" opacity=".9"/>
    <g filter="url(#ngs)"><circle cx="93" cy="53.5" r="3.4" fill="#fff"/><circle cx="107" cy="53.5" r="3.4" fill="#fff"/></g>
    <circle cx="100" cy="108" r="10" fill="url(#core)" opacity=".8"/>
    <circle cx="100" cy="108" r="4" fill="var(--accent)" filter="url(#ngs)"/>
  </symbol>

  <!-- ══════════════ ROBOT MEDITANDO ══════════════ -->
  <symbol id="r-zen" viewBox="0 0 200 240">
    <g fill="none" stroke="var(--accent)" stroke-width="1.6" opacity=".38" stroke-dasharray="3 6">
      <circle cx="100" cy="126" r="58"/><circle cx="100" cy="126" r="74"/><circle cx="100" cy="126" r="90"/>
    </g>
    <g filter="url(#ng)" fill="none" stroke="var(--accent)" stroke-width="5"
       stroke-linecap="round" stroke-linejoin="round">
      <!-- antena -->
      <line x1="100" y1="50" x2="100" y2="38" stroke-width="2.6" stroke="var(--accent-2)"/>
      <!-- cabeza -->
      <rect x="76" y="50" width="48" height="40" rx="12" stroke-width="3.4"/>
      <!-- torso -->
      <line x1="100" y1="90" x2="100" y2="98"/>
      <rect x="72" y="98" width="56" height="52" rx="11" stroke-width="3.4"/>
      <!-- piernas cruzadas -->
      <path d="M80 152 C60 166 66 190 94 190"/>
      <path d="M120 152 C140 166 134 190 106 190"/>
      <path d="M84 188 h32" stroke-width="4"/>
      <!-- brazos sobre rodillas -->
      <path d="M72 110 L54 140 L74 158"/>
      <path d="M128 110 L146 140 L126 158"/>
    </g>
    <g fill="var(--accent)" filter="url(#ngs)">
      <circle cx="54" cy="140" r="4.6"/><circle cx="146" cy="140" r="4.6"/>
      <circle cx="74" cy="158" r="4.2"/><circle cx="126" cy="158" r="4.2"/>
      <circle cx="100" cy="34" r="3.4" fill="var(--accent-2)"/>
    </g>
    <rect x="84" y="62" width="32" height="15" rx="5" fill="rgba(0,0,0,.55)" stroke="var(--accent)" stroke-width="1.6" opacity=".9"/>
    <!-- ojos cerrados: calma -->
    <g stroke="#fff" stroke-width="2.6" stroke-linecap="round" filter="url(#ngs)">
      <path d="M88 69.5 q5 4 10 0"/><path d="M102 69.5 q5 4 10 0"/>
    </g>
    <circle cx="100" cy="124" r="13" fill="url(#core)" opacity=".9"/>
    <circle cx="100" cy="124" r="4.6" fill="var(--accent)" filter="url(#ngs)"/>
  </symbol>

  <!-- ══════════════ ROBOT DURMIENDO ══════════════ -->
  <symbol id="r-sleep" viewBox="0 0 200 240">
    <!-- estrellas -->
    <g fill="var(--accent)" opacity=".65" filter="url(#ngs)">
      <path d="M28 44 l2.2 6 6 2.2 -6 2.2 -2.2 6 -2.2 -6 -6 -2.2 6 -2.2z"/>
      <path d="M172 62 l1.8 5 5 1.8 -5 1.8 -1.8 5 -1.8 -5 -5 -1.8 5 -1.8z"/>
      <path d="M60 20 l1.5 4.2 4.2 1.5 -4.2 1.5 -1.5 4.2 -1.5 -4.2 -4.2 -1.5 4.2 -1.5z"/>
      <circle cx="122" cy="34" r="2"/><circle cx="46" cy="86" r="1.8"/><circle cx="188" cy="120" r="1.8"/>
    </g>
    <!-- ZZZ -->
    <g fill="var(--accent)" font-family="Orbitron, sans-serif" font-weight="900" filter="url(#ngs)" opacity=".95">
      <text x="140" y="118" font-size="26">Z</text>
      <text x="164" y="92" font-size="19">Z</text>
      <text x="182" y="72" font-size="13">Z</text>
    </g>
    <g filter="url(#ng)" fill="none" stroke="var(--accent)" stroke-width="5"
       stroke-linecap="round" stroke-linejoin="round">
      <!-- superficie -->
      <line x1="12" y1="212" x2="188" y2="212" stroke-width="3" stroke="var(--accent-2)" opacity=".7"/>
      <!-- cabeza tumbada -->
      <rect x="130" y="150" width="42" height="36" rx="12" stroke-width="3.4"/>
      <line x1="172" y1="158" x2="184" y2="150" stroke-width="2.6" stroke="var(--accent-2)"/>
      <!-- torso -->
      <line x1="130" y1="168" x2="122" y2="168"/>
      <rect x="70" y="152" width="52" height="34" rx="10" stroke-width="3.4"/>
      <!-- cadera -->
      <rect x="48" y="156" width="22" height="26" rx="7" stroke-width="3.4"/>
      <!-- piernas recogidas -->
      <path d="M50 166 L24 164 L16 180"/>
      <path d="M50 176 L28 180 L22 194"/>
      <!-- brazo -->
      <path d="M104 186 L88 196 L70 192"/>
    </g>
    <g fill="var(--accent)" filter="url(#ngs)">
      <circle cx="24" cy="164" r="4.4"/><circle cx="28" cy="180" r="4.4"/>
      <circle cx="88" cy="196" r="4.2"/>
      <circle cx="186" cy="149" r="3.2" fill="var(--accent-2)"/>
    </g>
    <rect x="138" y="160" width="28" height="14" rx="5" fill="rgba(0,0,0,.6)" stroke="var(--accent)" stroke-width="1.5" opacity=".85"/>
    <g stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".8">
      <path d="M142 167 q4 3 8 0"/><path d="M154 167 q4 3 8 0"/>
    </g>
    <circle cx="96" cy="169" r="9" fill="url(#core)" opacity=".55"/>
    <circle cx="96" cy="169" r="3.4" fill="var(--accent)" opacity=".8"/>
  </symbol>

  <!-- ══════════════ ROBOT EN HIIT ══════════════ -->
  <symbol id="r-hiit" viewBox="0 0 200 240">
    <!-- líneas de velocidad -->
    <g stroke="var(--accent-2)" stroke-width="3" stroke-linecap="round" opacity=".55">
      <line x1="6" y1="60" x2="26" y2="54"/><line x1="4" y1="76" x2="20" y2="72"/>
      <line x1="194" y1="60" x2="174" y2="54"/><line x1="196" y1="76" x2="180" y2="72"/>
      <line x1="16" y1="196" x2="34" y2="192"/><line x1="184" y1="196" x2="166" y2="192"/>
    </g>
    <ellipse cx="100" cy="214" rx="46" ry="6" fill="none" stroke="var(--accent)"
             stroke-width="2" stroke-dasharray="4 5" opacity=".5"/>
    <g filter="url(#ng)" fill="none" stroke="var(--accent)" stroke-width="5"
       stroke-linecap="round" stroke-linejoin="round">
      <!-- brazos en X -->
      <path d="M74 74 L44 54 L30 28"/>
      <path d="M126 74 L156 54 L170 28"/>
      <!-- cabeza -->
      <rect x="78" y="24" width="44" height="38" rx="12" stroke-width="3.4"/>
      <line x1="112" y1="24" x2="122" y2="12" stroke-width="2.6" stroke="var(--accent-2)"/>
      <!-- torso -->
      <line x1="100" y1="62" x2="100" y2="68"/>
      <rect x="74" y="68" width="52" height="48" rx="11" stroke-width="3.4"/>
      <rect x="80" y="116" width="40" height="13" rx="6" stroke-width="3.4"/>
      <!-- piernas abiertas en salto -->
      <path d="M86 129 L58 154 L38 178"/>
      <path d="M114 129 L142 154 L162 178"/>
      <line x1="38" y1="178" x2="26" y2="184"/>
      <line x1="162" y1="178" x2="174" y2="184"/>
    </g>
    <g fill="var(--accent)" filter="url(#ngs)">
      <circle cx="44" cy="54" r="4.6"/><circle cx="156" cy="54" r="4.6"/>
      <circle cx="30" cy="28" r="4.2"/><circle cx="170" cy="28" r="4.2"/>
      <circle cx="58" cy="154" r="4.6"/><circle cx="142" cy="154" r="4.6"/>
      <circle cx="124" cy="9" r="3.4" fill="var(--accent-2)"/>
    </g>
    <rect x="85" y="35" width="30" height="14" rx="5" fill="rgba(0,0,0,.55)" stroke="var(--accent)" stroke-width="1.6" opacity=".9"/>
    <g filter="url(#ngs)"><circle cx="93" cy="42" r="3.2" fill="#fff"/><circle cx="107" cy="42" r="3.2" fill="#fff"/></g>
    <circle cx="100" cy="92" r="12" fill="url(#core)"/>
    <circle cx="100" cy="92" r="4.6" fill="#fff" filter="url(#ngs)"/>
  </symbol>

  <!-- ══════════════ ROBOT ATLETA ══════════════ -->
  <symbol id="r-athlete" viewBox="0 0 200 240">
    <g filter="url(#ng)" fill="none" stroke="var(--accent)" stroke-width="5"
       stroke-linecap="round" stroke-linejoin="round">
      <!-- antena -->
      <line x1="100" y1="26" x2="100" y2="14" stroke-width="2.6" stroke="var(--accent-2)"/>
      <!-- cabeza -->
      <rect x="76" y="26" width="48" height="40" rx="12" stroke-width="3.4"/>
      <!-- torso -->
      <line x1="100" y1="66" x2="100" y2="74"/>
      <rect x="72" y="74" width="56" height="54" rx="11" stroke-width="3.4"/>
      <!-- pectorales / paneles -->
      <path d="M84 88 h13 M103 88 h13" stroke-width="2.4" stroke="var(--accent-2)" opacity=".8"/>
      <!-- brazo izq. relajado -->
      <path d="M72 84 L56 112 L62 138"/>
      <!-- brazo der. flexionado (bíceps) -->
      <path d="M128 84 L148 106 L134 78"/>
      <!-- cadera y piernas -->
      <rect x="78" y="128" width="44" height="14" rx="6" stroke-width="3.4"/>
      <path d="M86 142 L82 178 L84 212"/>
      <path d="M114 142 L118 178 L116 212"/>
      <line x1="84" y1="214" x2="98" y2="214"/>
      <line x1="116" y1="214" x2="130" y2="214"/>
    </g>
    <g fill="var(--accent)" filter="url(#ngs)">
      <circle cx="56" cy="112" r="4.6"/><circle cx="148" cy="106" r="4.6"/>
      <circle cx="62" cy="138" r="4.2"/><circle cx="134" cy="78" r="4.4"/>
      <circle cx="82" cy="178" r="4.6"/><circle cx="118" cy="178" r="4.6"/>
      <circle cx="100" cy="11" r="3.4" fill="var(--accent-2)"/>
    </g>
    <rect x="84" y="38" width="32" height="15" rx="5" fill="rgba(0,0,0,.55)" stroke="var(--accent)" stroke-width="1.6" opacity=".9"/>
    <g filter="url(#ngs)"><circle cx="93" cy="45.5" r="3.4" fill="#fff"/><circle cx="107" cy="45.5" r="3.4" fill="#fff"/></g>
    <circle cx="100" cy="102" r="12" fill="url(#core)" opacity=".9"/>
    <circle cx="100" cy="102" r="4.6" fill="var(--accent)" filter="url(#ngs)"/>
  </symbol>
</svg>
