<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<defs>
  <!-- El aro recorre todo el espectro; la VI lleva su propio degradado
       cian a violeta, porque el cian es el color con el que se reconoce
       la marca en el resto de la tienda. -->
  <linearGradient id="ga" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="512" y2="512">
    <stop offset="0%" stop-color="#00d4ff"/><stop offset="38%" stop-color="#7b2fff"/>
    <stop offset="72%" stop-color="#ff2ecb"/><stop offset="100%" stop-color="#00d4ff"/>
  </linearGradient>
  <linearGradient id="gt" gradientUnits="userSpaceOnUse" x1="122.9" y1="0" x2="389.1" y2="512">
    <stop offset="0%" stop-color="#7df3ff"/><stop offset="45%" stop-color="#00d4ff"/>
    <stop offset="100%" stop-color="#7b2fff"/>
  </linearGradient>
  <radialGradient id="fondo" cx="50%" cy="42%" r="72%">
    <stop offset="0%" stop-color="#111233"/><stop offset="62%" stop-color="#08081a"/>
    <stop offset="100%" stop-color="#05050f"/>
  </radialGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="11.26" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="512" height="512" rx="112.6" fill="url(#fondo)"/>
<circle cx="256.0" cy="256.0" r="233.0" fill="none" stroke="url(#ga)" stroke-width="16.38"
        stroke-dasharray="29.70 21.50" stroke-linecap="round" filter="url(#glow)"/>
<text x="256.0" y="263.7" fill="url(#gt)" filter="url(#glow)"
      font-family="Orbitron, DejaVu Sans, Verdana, sans-serif" font-weight="900"
      font-size="215.0" letter-spacing="7.68"
      text-anchor="middle" dominant-baseline="central">VI</text>
</svg>